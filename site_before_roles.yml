---

- hosts: all
  become: true
  pre_tasks:
  - name: Update cache (ubuntu)
    tags: always
    apt:
      update_cache: yes
    changed_when: false

- hosts: all
  become: true
  tasks:
  - name: add ssh key for simone
    tags: always
    authorized_key:
      user: simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDRc0Z36Wp1B4hOQ49Iv2Lr0w0JMwcGEnRSGElER4ozL ansible"


- hosts: workstations
  become: true
  tasks:
  - name: install unzip
    package:
      name: unzip
  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root

- hosts: web_servers
  become: true
  tasks:
  - name: install apache and php
    tags: apache, apache2, ubuntu
    package:
      name:
        - apache2
        - libapache2-mod-php
      state: latest

  - name: copy default html file for site
    tags: apache, apache2, httpd
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  become: true
  tasks:
  - name: install mariadb package
    tags: db, mariadb, ubuntu
    apt:
      name: mariadb-server
      state: latest

- hosts: file_servers
  become: true
  tasks:
  - name: install samba package
    tags: samba
    package:
      name: samba
